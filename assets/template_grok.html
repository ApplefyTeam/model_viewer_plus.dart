<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
    body,
    model-viewer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
</style>
<script type="module" src="model-viewer.min.js" defer></script>
<!-- body -->

<script>
/* --------------------- MULTI-LAYER STATE --------------------- */

let backgroundColor = "#ffffff";
let canvasTexture = null;

/* --------------------- MODEL VIEWER INIT --------------------- */
function tryInitialize() {
    console.log("🚀 tryInitialize() called");

    if (document.readyState === 'loading') {
        console.log("⏳ Document still loading, waiting for DOMContentLoaded...");
        document.addEventListener('DOMContentLoaded', () => {
            console.log("✅ DOMContentLoaded fired, initializing Model Viewer...");
            initializeModelViewer();
        });
    } else {
        console.log("✅ Document already loaded, initializing Model Viewer...");
        initializeModelViewer();
    }
}


// Called once the DOM is ready or immediately if DOM already loaded
function initializeModelViewer() {
    console.log("Initializing Model Viewer");
    canvasTexture = null;

    onModelLoadStarted();

    const modelViewer = getModelViewer();
    if (!modelViewer) {
        console.error("Model viewer element not found");
        return;
    }

    // Log device pixel ratio (from original code)
    console.log("Device pixel ratio:", window.devicePixelRatio);

    // On model load, create the canvas texture
    modelViewer.addEventListener("load", async () => {
        console.log("Model viewer loaded");
        canvasTexture = modelViewer.createCanvasTexture();

        // Setup offscreen canvas for higher resolution, if needed
        const offscreenCanvas = document.createElement('canvas');
        adjustCanvasResolution(offscreenCanvas);
        canvasTexture.source.element.offscreenCanvas = offscreenCanvas;

        adjustCanvasResolution(canvasTexture.source.element);

        onModelLoaded();
    });

    modelViewer.addEventListener("error", (error) => {
        console.error("Model viewer error:", error);
    });
}

// Resets or returns existing canvas texture
function getCanvasTexture() {
    const modelViewer = getModelViewer();
    if (!modelViewer) {
        console.error("⚠️ Model viewer is not ready yet!");
        return null;  // Prevent further errors
    }

    if (!canvasTexture) {
        console.log("Creating new canvas texture");
        canvasTexture = modelViewer.createCanvasTexture();
    }
    return canvasTexture;
}


// Adjust canvas resolution (from original code)
function adjustCanvasResolution(canvas) {
    const canvasSize = 1024;
    canvas.width = canvasSize;
    canvas.height = canvasSize;
    const ctx = canvas.getContext("2d");
    // Example upscaling factor:
    // ctx.scale(2, 2);
    console.log(`Canvas size set to ${canvas.width}x${canvas.height}`);
}


// ================== RENDER LAYERS ==================
window.renderLayersJS = function (layers) {
    console.log("🖌️ Received layer data from Dart, rendering...");

    // Reset stored layers (we don't track them in JS anymore)
    const canvas = getCanvasTexture()?.source.element;
    if (!canvas) {
        console.error("🚨 ERROR: Canvas is null!");
        return;
    }
    const ctx = canvas.getContext('2d');

    // Clear and set background
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = backgroundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Loop and draw each layer
    layers.forEach(layer => {
        if (!layer.visible) {
            console.log(`⏭️ Skipping hidden layer: ${layer.id}`);
            return;
        }
        if (layer.type === "text") {
            drawTextLayer(layer, ctx, canvas);
        } else if (layer.type === "image") {
            drawImageLayer(layer, ctx, canvas);
        } else {
            console.warn(`⚠️ Unknown layer type: ${layer.type}`);
        }


        if (layer.selected) {
            drawSelectionControls(layer, ctx, canvas);
        }
    });

    console.log("🔄 Updating canvas texture...");
    getCanvasTexture()?.source.update();

    forceTextureUpdate();
    // exportCanvasTexture();
};

function drawTextLayer(layer, ctx, canvas) {
    ctx.save();
    const scaleFactor = (canvas.width / 2) / 512;  // e.g. 2
    const posX = (layer.x || 0) * scaleFactor;
    const posY = (layer.y || 0) * scaleFactor;

    const baseFontSize = layer.fontSize || 24;
    const adjustedFontSize = baseFontSize * scaleFactor;
    ctx.font = `${adjustedFontSize}px Arial, sans-serif`;

    // measureText returns unscaled width.
    const textMetrics = ctx.measureText(layer.content);
    // Adjust the measured width by the scale factor
    const textWidth = textMetrics.width * scaleFactor;
    const textHeight = adjustedFontSize * 1.2; // already in scaled units

    // Translate to the center of the text bounding box.
    ctx.translate(
        posX + 35 * scaleFactor + textWidth / 2,
        posY + 86 * scaleFactor + textHeight / 2
    );

    ctx.scale(1, -1); // Flip vertically
    ctx.rotate((layer.rotation || 0) * Math.PI / 180);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = layer.color || textColorDefault;

    ctx.fillText(layer.content, 0, 0);
    ctx.restore();
}



/* ------------------------- IMAGE LAYER ------------------------- */
function drawImageLayer(layer, ctx, canvas) {
    console.log(`🖼️ Drawing Image: ${layer.content}`);

    const image = new Image();
    image.onload = function () {
        ctx.save();

        const posX = (layer.x || 0) * (canvas.width / 512);
        const posY = (layer.y || 0) * (canvas.height / 512);

        ctx.translate(
            posX + 35 * (canvas.width / 512),
            posY + 86 * (canvas.height / 512)
        );

        ctx.scale(1, -1);
        ctx.rotate((layer.rotation || 0) * Math.PI / 180);

        const imageWidth = layer.imageWidth || 100;
        const imageHeight = layer.imageHeight || 100;

        ctx.drawImage(image, -imageWidth / 2, -imageHeight / 2, imageWidth, imageHeight);

        console.log(`📍 Image drawn at (${posX}, ${posY})`);
        ctx.restore();

        // Ensure texture updates after image loads
        getCanvasTexture()?.source.update();
        forceTextureUpdate();
    };

    image.onerror = function () {
        console.error(`🚨 ERROR: Could not load image: ${layer.content}`);
    };

    image.src = layer.content; // Image URL or base64
}

/* ------------------------- SELECTION CONTROLS ------------------------- */
function drawSelectionControls(layer, ctx, canvas) {
    ctx.save();

    const scaleFactor = (canvas.width / 2) / 512;
    const posX = (layer.x || 0) * scaleFactor;
    const posY = (layer.y || 0) * scaleFactor;
    const btnSize = 12;

    let width, height;
    if (layer.type === "text") {
        const baseFontSize = layer.fontSize || 24;
        const adjustedFontSize = baseFontSize * scaleFactor;
        ctx.font = `${adjustedFontSize}px Arial, sans-serif`;
        const textMetrics = ctx.measureText(layer.content || "Text");
        // Adjust measured width
        width = textMetrics.width * scaleFactor;
        height = adjustedFontSize * 1.2;
    } else if (layer.type === "image") {
        width = layer.imageWidth || 100;
        height = layer.imageHeight || 50;
    }

    ctx.translate(
        posX + 35 * scaleFactor + width / 2,
        posY + 86 * scaleFactor + height / 2
    );

    ctx.scale(1, -1);
    ctx.rotate((layer.rotation || 0) * Math.PI / 180);

    ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
    ctx.lineWidth = 2;
    ctx.strokeRect(-width / 2, -height / 2, width, height);

    // 6️⃣ Draw Control Buttons
    const halfWidth = width / 2;
    const halfHeight = height / 2;

    drawControlButton(ctx, -halfWidth, -halfHeight, btnSize, "🔄", "rotate", layer.id);
    drawControlButton(ctx, halfWidth, -halfHeight, btnSize, "❌", "delete", layer.id);
    drawControlButton(ctx, -halfWidth, halfHeight, btnSize, "↔️", "resize", layer.id);
    drawControlButton(ctx, halfWidth, halfHeight, btnSize, "✋", "move", layer.id);

    ctx.restore();
}

function drawControlButton(ctx, x, y, size, label, type, layerId) {
    ctx.save();

    // **DO NOT Flip Again** (It was already flipped in `drawSelectionControls`)
    ctx.translate(x, y); // Correct for position

    // **Draw button shape**
    ctx.beginPath();
    ctx.arc(0, 0, size / 2, 0, 2 * Math.PI);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.stroke();

    // **Draw text/icon correctly**
    ctx.fillStyle = "black";
    ctx.font = `${size}px Arial, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, 0, 0);

    // **Store button for click detection**
    if (!window.controlButtons) {
        window.controlButtons = [];
    }
    window.controlButtons.push({ x, y, size, type, layerId });

    ctx.restore(); // Restore context after drawing
}

function isPointInsideCircle(px, py, cx, cy, radius) {
    const dx = px - cx;
    const dy = py - cy;
    return (dx * dx + dy * dy) <= (radius * radius);
}

function handleControlButtonClick(event) {
    event.preventDefault();
    event.stopPropagation();

    const canvas = getCanvasTexture()?.source.element;
    if (!canvas) {
        console.error("🚨 Canvas not found for click detection");
        return;
    }
    const rect = canvas.getBoundingClientRect();

    let pointerX, pointerY;
    if (event.touches && event.touches.length > 0) {
        pointerX = event.touches[0].clientX - rect.left;
        pointerY = event.touches[0].clientY - rect.top;
        console.log(`👇 Touch detected at canvas coords: (${pointerX.toFixed(2)}, ${pointerY.toFixed(2)})`);
    } else {
        pointerX = event.clientX - rect.left;
        pointerY = event.clientY - rect.top;
        console.log(`🖱️ Click detected at canvas coords: (${pointerX.toFixed(2)}, ${pointerY.toFixed(2)})`);
    }

    if (window.controlButtons && window.controlButtons.length > 0) {
        for (let i = 0; i < window.controlButtons.length; i++) {
            const btn = window.controlButtons[i];
            if (isPointInsideCircle(pointerX, pointerY, btn.x, btn.y, btn.size / 2)) {
                console.log(`✅ Hit control button: ${btn.type} for layer ${btn.layerId} at (${btn.x.toFixed(2)}, ${btn.y.toFixed(2)})`);
                triggerControlAction(btn.layerId, btn.type);
                break; // Stop after first hit
            }
        }
    } else {
        console.log("ℹ️ No control buttons to check");
    }
}

function triggerControlAction(layerId, controlType) {
    console.log(`🎬 Triggering action: ${controlType} for layer ${layerId}`);
    const actionData = { layerId, action: controlType };

    if (controlType === "delete") {
        console.log(`🗑️ Delete action initiated for layer ${layerId}`);
        notifyFlutter(actionData);
    } else if (controlType === "rotate") {
        console.log(`🔄 Rotate action initiated for layer ${layerId}`);
        notifyFlutter(actionData);
        // TODO: Start rotation flow (e.g., track mouse/touch movement)
    } else if (controlType === "resize") {
        console.log(`📏 Resize action initiated for layer ${layerId}`);
        notifyFlutter(actionData);
        // TODO: Start resize flow
    } else if (controlType === "move") {
        console.log(`✋ Move action initiated for layer ${layerId}`);
        notifyFlutter(actionData);
        // TODO: Start move flow
    }
}

function notifyFlutter(data) {
    if (typeof ControlAction !== 'undefined' && ControlAction.postMessage) {
        console.log(`📤 Sending to Flutter: ${JSON.stringify(data)}`);
        ControlAction.postMessage(JSON.stringify(data));
    } else {
        console.warn("⚠️ ControlAction channel not defined, cannot notify Flutter");
    }
}

function setupControlClickListener() {
    const modelViewer = getModelViewer();
    if (!modelViewer) {
        console.error("🚨 Model viewer not found for click setup");
        return;
    }

    modelViewer.addEventListener('click', (event) => {
        const uv = modelViewer.positionAndNormalFromPoint(event.clientX, event.clientY)?.uv;
        if (!uv) {
            console.log("ℹ️ Click outside model");
            return;
        }

        const canvas = getCanvasTexture()?.source.element;
        if (!canvas) return;

        // Convert UV to canvas coordinates
        const canvasX = uv.x * canvas.width;
        const canvasY = (1 - uv.y) * canvas.height; // Flip y-axis
        console.log(`🌐 UV (${uv.x.toFixed(2)}, ${uv.y.toFixed(2)}) mapped to canvas (${canvasX.toFixed(2)}, ${canvasY.toFixed(2)})`);

        // Simulate a click event on the canvas
        handleControlButtonClick({
            clientX: event.clientX,
            clientY: event.clientY,
            preventDefault: event.preventDefault.bind(event),
            stopPropagation: event.stopPropagation.bind(event)
        });
    });

    // Add touch support
    modelViewer.addEventListener('touchstart', (event) => {
        handleControlButtonClick({
            touches: event.touches,
            preventDefault: event.preventDefault.bind(event),
            stopPropagation: event.stopPropagation.bind(event)
        });
    });
}

// Call this after model loads or during initialization
const modelViewer = getModelViewer();
modelViewer.addEventListener('load', () => {
    console.log("🚀 Setting up control click listener");
    setupControlClickListener();
});


/* ------------------------- FORCE TEXTURE UPDATE ------------------------- */
function forceTextureUpdate() {
    const modelViewer = getModelViewer();
    if (!modelViewer) {
        console.error("⚠️ Model viewer not found!");
        return;
    }

    const material = modelViewer.model.materials[0];
    const { baseColorTexture } = material.pbrMetallicRoughness;

    baseColorTexture.setTexture(getCanvasTexture());
    console.log("🔄 ModelViewer Texture Updated!");
}

function exportCanvasTexture() {
    const canvas = getCanvasTexture()?.source.element;
    if (!canvas) {
        console.error("🚨 Cannot export: No canvas found!");
        return;
    }

    const link = document.createElement('a');
    link.download = "debug-texture.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}

/* -------------- MODEL EVENT HANDLERS -------------- */
window.ModelLoaded = window.ModelLoaded || {};
window.ModelLoadStarted = window.ModelLoadStarted || {};
window.ModelSaved = window.ModelSaved || {};

function onModelLoadStarted() {
    try {
        // For mobile platforms
        if (typeof ModelLoadStarted !== 'undefined' && ModelLoadStarted.postMessage) {
            console.log('Model Load Started on Mobile');
            ModelLoadStarted.postMessage("model_load_started");
        }
        // For web platforms
        else if (typeof window.ModelLoadStarted !== 'undefined') {
            console.log('Model Load Started on Web');
            const event = new Event('ModelLoadStarted');
            window.dispatchEvent(event);
        } else {
            console.error('ModelLoadStarted is not defined on any platform');
        }
    } catch (error) {
        console.error('Error in onModelLoadStarted:', error);
    }
}

function onModelLoaded() {
    try {
        // For mobile platforms
        if (typeof ModelLoaded !== 'undefined' && ModelLoaded.postMessage) {
            console.log('Model Loaded on Mobile');
            ModelLoaded.postMessage("model_loaded");
        }
        // For web platforms
        else if (typeof window.ModelLoaded !== 'undefined') {
            console.log('Model Loaded on Web');
            const event = new Event('ModelLoaded');
            window.dispatchEvent(event);
        } else {
            console.error('ModelLoaded is not defined on any platform');
        }
    } catch (error) {
        console.error('Error in onModelLoaded:', error);
    }
}

window.setBackgroundColorJS = (color) => {
    if (!color) {
        console.warn("⚠️ Invalid background color received:", color);
    }
    if (backgroundColor !== color) {
        backgroundColor = color;
        console.log("✅ Background Color Set to: -->" + color + "<--");
    } else {
        console.log("⚠️ Skipping redundant background update.");
    }
}

/* -------------- EXPORT/SAVE GLB -------------- */
window.saveGLB = async function () {
    console.log("Save button clicked");
    const modelViewer = getModelViewer();
    const glTF = await modelViewer.exportScene();

    // Create filename based on current datetime
    const filename = `save-${new Date().toISOString().replace(/:/g, "-")}.glb`;
    const file = new File([glTF], filename);
    try {
        await sendFileToDart(file, "save");
        console.log("Saved model and sent to Dart");
    } catch (error) {
        console.error("Error saving model:", error);
        // Fallback to direct download
        const link = document.createElement("a");
        link.download = file.name;
        link.href = URL.createObjectURL(file);
        link.click();
    }
};

window.exportGLB = async function () {
    console.log("Export button clicked");
    const modelViewer = getModelViewer();
    const glTF = await modelViewer.exportScene();

    // Create filename based on current datetime
    const filename = `export-${new Date().toISOString().replace(/:/g, "-")}.glb`;
    const file = new File([glTF], filename);
    try {
        await sendFileToDart(file, "export");
        console.log("Exported model and sent to Dart");
    } catch (error) {
        console.error("Error exporting model:", error);
        // Fallback to direct download
        const link = document.createElement("a");
        link.download = file.name;
        link.href = URL.createObjectURL(file);
        link.click();
    }
};

/* -------------- UTILITY -------------- */
// Return the <model-viewer> element
function getModelViewer() {
    return document.getElementById('modelViewer');
}

// Send the file to the Flutter side if available
async function sendFileToDart(file, action) {
    const reader = new FileReader();
    reader.onload = function (event) {
        const base64data = event.target.result.split(',')[1]; // Remove data: URL prefix
        const fileData = {
            name: file.name,
            type: file.type,
            size: file.size,
            lastModified: file.lastModified,
            content: base64data,
            action: action
        };
        const fileDataJson = JSON.stringify(fileData);

        if (typeof ExportModel !== 'undefined' && ExportModel.postMessage) {
            // For mobile platforms
            console.log('Sending file to Dart via ExportModel.postMessage');
            ExportModel.postMessage(fileDataJson);
        } else if (typeof window.ModelSaved !== 'undefined') {
            console.log('Model Loaded on Web');
            const event = new CustomEvent('ModelSaved', {
                detail: fileDataJson
            });
            window.dispatchEvent(event);

            // If exporting but no mobile channel, fallback to download
            if (action === "export") {
                console.error('ExportModel is not defined');
                const link = document.createElement("a");
                link.download = file.name;
                link.href = URL.createObjectURL(file);
                link.click();
            }
        } else {
            console.error('ExportModel is not defined');
            // Fallback to direct download
            const link = document.createElement("a");
            link.download = file.name;
            link.href = URL.createObjectURL(file);
            link.click();
        }
    };
    reader.readAsDataURL(file);
}

function initApp() {
    // Disable context menu and text selection
    document.addEventListener('contextmenu', (event) => {
        console.log("contextmenu prevented");
        event.preventDefault();
    });
    document.addEventListener('selectstart', (event) => {
        console.log("selectstart prevented");
        event.preventDefault();
    });

    console.log("⚡ DOMContentLoaded (or already ready) event fired!");

    // Wait until the <model-viewer> component is defined.
    customElements.whenDefined('model-viewer').then(() => {
        console.log("✅ model-viewer component is ready!");
        tryInitialize();

        // After initialization, attach the canvas event listeners.
        // (Assuming that tryInitialize() or some subsequent code creates your canvas.)
        const canvasElement = getCanvasTexture()?.source.element;
        if (canvasElement) {
            // Attach mouse and touch event listeners for control button interactions.
            canvasElement.addEventListener("mousedown", handleControlButtonClick);
            canvasElement.addEventListener("touchstart", handleControlButtonClick);
            console.log("Control button event listeners attached.");
        } else {
            console.error("Canvas element not found. Could not attach event listeners.");
        }
    }).catch(error => {
        console.error("❌ model-viewer failed to initialize:", error);
    });

    document.body.style.setProperty('-webkit-touch-callout', 'none');
}

// Check if the DOM is already loaded
if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initApp);
} else {
    initApp();
}

tryInitialize();


</script>
